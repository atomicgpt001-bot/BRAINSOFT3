server {
    listen 80;
    server_name precios.tu-dominio-atomic.com; # <-- Reemplazar con tu dominio real de Atomic

    root /var/www/soft3-brain/frontend;
    index prices/index.html;

    # Bloqueo estricto del Cerebro técnico de Soft3 para el público
    location ~* /(soft3_v2\.html|soft3\.html|soft3\.js|style_v2\.css|renderer\.js|neural_graph\.js) {
        return 403;
    }

    location / {
        try_files $uri $uri/ /prices/index.html;
    }

    # Redirección de llamadas de API al backend de Node
    location /api/ {
        proxy_pass http://127.0.0.1:3051;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
