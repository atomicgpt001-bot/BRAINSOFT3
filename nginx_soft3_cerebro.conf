server {
    listen 80;
    server_name cerebro.dominio-cliente.com; # <-- Reemplazar con el subdominio del cliente

    root /var/www/soft3-brain/frontend;
    index soft3_v2.html;

    # Protección con usuario y contraseña
    auth_basic "Acceso Restringido - Soft3 Developers";
    auth_basic_user_file /etc/nginx/.htpasswd_soft3;

    location / {
        try_files $uri $uri/ /soft3_v2.html;
    }

    # Redirección de llamadas de API
    location /api/ {
        proxy_pass http://127.0.0.1:3051;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
