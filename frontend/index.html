<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerebro Icaro - Modo Cyberpunk</title>
    <link rel="stylesheet" href="icaro.css">
    <!-- Solo para admin -->
    <script src="//unpkg.com/3d-force-graph"></script>
</head>
<body>

    <!-- Login Modal -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Acceso a Sistema</h2>
            <input type="text" id="username" placeholder="Usuario" autocomplete="off">
            <input type="password" id="password" placeholder="PIN / Contraseña" autocomplete="off">
            <button id="btn-login-admin">Entrar como Admin</button>
            <button id="btn-login-sales" class="secondary">Entrar como Vendedor</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="main-container">
        
        <!-- Sidebar: Price List -->
        <div id="sidebar">
            <div class="sidebar-header">
                <h2>Lista de Precios</h2>
            </div>
            <div id="prices-list">
                <!-- Precios cargados por JS -->
            </div>
            
            <!-- Editor solo para admin -->
            <div id="editor-panel">
                <textarea id="price-editor-text" placeholder="Formato: Producto - Precio"></textarea>
                <button id="btn-save-prices" style="width: 100%; margin-top: 5px;">Guardar Precios</button>
            </div>
        </div>

        <!-- Center: 3D Graph (Admin only) -->
        <div id="center-panel">
            <div id="graph-container"></div>
        </div>

        <!-- Right Panel: Chat -->
        <div id="chat-panel">
            <div class="panel-header">
                <h3 id="chat-title">Terminal Icaro</h3>
            </div>
            <div id="chat-history">
                <div class="message ai-message">
                    <div class="message-content">
                        Conexión establecida. Soy ICARO, Inteligencia de Ventas de Atomic.
                    </div>
                </div>
            </div>
            <div id="chat-input-container">
                <textarea id="chat-input" placeholder="Escribe un comando o consulta..." rows="1"></textarea>
                <button id="send-btn">Enviar</button>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
