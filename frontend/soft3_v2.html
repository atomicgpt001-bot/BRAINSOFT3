<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerebro Soft 3 — v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/3d-force-graph"></script>
    <style>
        :root {
            --bg: #0d1117;
            --sidebar-bg: #161b22;
            --panel-bg: #161b22;
            --border: #30363d;
            --blue: #58a6ff;
            --green: #3fb950;
            --purple: #bc8cff;
            --orange: #f78166;
            --yellow: #e3b341;
            --teal: #39d353;
            --text: #e6edf3;
            --muted: #8b949e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* TOP BAR */
        #topbar {
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }
        #topbar h1 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--blue);
            letter-spacing: 0.05em;
        }
        #topbar .badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
        }
        .badge-commits { background: rgba(88,166,255,0.15); color: var(--blue); border: 1px solid var(--blue); }
        .badge-errors  { background: rgba(247,129,102,0.15); color: var(--orange); border: 1px solid var(--orange); }
        #current-user-display {
            margin-left: auto;
            font-size: 0.8rem;
            color: var(--muted);
        }
        #current-user-display span { color: var(--green); font-weight: 600; }
        #edit-profile-btn {
            background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1rem;
            transition: color 0.2s;
        }
        #edit-profile-btn:hover { color: var(--blue); }

        /* MAIN LAYOUT: Graph | Chat */
        #main-area {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* GRAPH PANEL */
        #graph-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--bg);
            min-width: 0;
        }
        .panel-header {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--sidebar-bg);
            font-size: 0.75rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .panel-header strong { color: var(--text); font-size: 0.85rem; }
        #graph-container {
            flex: 1;
            width: 100%;
        }

        /* Legend */
        #graph-legend {
            padding: 8px 14px;
            border-top: 1px solid var(--border);
            background: var(--sidebar-bg);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; color: var(--muted); }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

        /* CHAT PANEL */
        #chat-panel {
            width: 400px;
            min-width: 340px;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            flex-shrink: 0;
        }

        /* New chat button */
        #new-chat-btn {
            margin: 12px;
            padding: 8px 14px;
            background: var(--blue);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }
        #new-chat-btn:hover { opacity: 0.85; }

        #chat-topic-label {
            padding: 6px 14px;
            font-size: 0.72rem;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        #chat-topic-label span { color: var(--purple); font-weight: 600; }

        /* Messages */
        #chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #chat-history::-webkit-scrollbar { width: 5px; }
        #chat-history::-webkit-scrollbar-track { background: transparent; }
        #chat-history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .message { display: flex; flex-direction: column; max-width: 88%; }
        .user-message { align-self: flex-end; }
        .ai-message { align-self: flex-start; }

        .message-content {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .user-message .message-content {
            background: var(--blue);
            color: #000;
            border-bottom-right-radius: 4px;
        }
        .ai-message .message-content {
            background: #1f2937;
            color: var(--text);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }
        .message-meta {
            font-size: 0.65rem;
            color: var(--muted);
            margin-top: 3px;
            padding: 0 4px;
        }
        .user-message .message-meta { text-align: right; }

        /* Typing indicator */
        .typing-dots {
            display: flex; gap: 4px; align-items: center;
        }
        .typing-dots span {
            width: 6px; height: 6px; background: var(--muted);
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Input area */
        #chat-input-area {
            padding: 12px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        #chat-form {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        #message-input {
            flex: 1;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            resize: none;
            max-height: 120px;
            line-height: 1.4;
            transition: border-color 0.2s;
        }
        #message-input:focus { outline: none; border-color: var(--blue); }
        #message-input::placeholder { color: var(--muted); }

        #send-btn {
            background: var(--blue);
            border: none;
            border-radius: 8px;
            width: 38px;
            height: 38px;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }
        #send-btn:hover { opacity: 0.85; }

        /* Responsive: on narrow screens, hide graph */
        @media (max-width: 800px) {
            #graph-panel { display: none; }
            #chat-panel { width: 100%; max-width: 100%; }
        }

        /* Animations */
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .message { animation: fadeSlideIn 0.25s ease; }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div id="topbar">
        <h1>🧠 CEREBRO SOFT 3</h1>
        <span class="badge badge-commits">10 Commits Hoy</span>
        <span class="badge badge-errors">7 Bugs Resueltos</span>
        <div id="current-user-display">Usuario: <span id="current-user">ATOMIC</span></div>
        <button id="edit-profile-btn" title="Cambiar nombre">✏️</button>
    </div>

    <div id="main-area">

        <!-- GRAPH PANEL -->
        <div id="graph-panel">
            <div class="panel-header">
                <strong>🌐 Mapa Neuronal</strong>
                <span id="current-node-indicator">Sesión: 11 Jun 2026 — Clic en un nodo para enfocar</span>
            </div>
            <div id="graph-container"></div>
            <div id="graph-legend">
                <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>Núcleo Soft 3</div>
                <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Softres</div>
                <div class="legend-item"><div class="legend-dot" style="background:#39d353"></div>Módulos Softres</div>
                <div class="legend-item"><div class="legend-dot" style="background:#bc8cff"></div>Módulos Soft 3</div>
                <div class="legend-item"><div class="legend-dot" style="background:#e3b341"></div>Commits</div>
                <div class="legend-item"><div class="legend-dot" style="background:#f78166"></div>Errores</div>
                <div class="legend-item"><div class="legend-dot" style="background:#79c0ff"></div>Bóveda</div>
            </div>
        </div>

        <!-- CHAT PANEL -->
        <div id="chat-panel">
            <button id="new-chat-btn">＋ Nueva Sesión</button>
            <div id="chat-topic-label">Enfoque: <span id="chat-topic">General</span></div>
            <div id="chat-history"></div>
            <div id="chat-input-area">
                <form id="chat-form">
                    <textarea id="message-input" placeholder="Escribe un mensaje..." rows="1"></textarea>
                    <button type="submit" id="send-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </form>
            </div>
        </div>

    </div>

    <script src="soft3_v2.js"></script>
</body>
</html>
